<nav> </nav>

<main class="container" style="max-width: 600px;">
    <h1>Get in Touch</h1>
    <p>Have questions about ShiftGrid or need help with a custom configuration? We're here to help.</p>

    <form style="display: grid; gap: 1.5rem; margin-top: 2rem;">
        <div>
            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Name</label>
            <input type="text" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px;">
        </div>
        <div>
            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Email</label>
            <input type="email" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px;">
        </div>
        <div>
            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Message</label>
            <textarea style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px; height: 150px;"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Send Message</button>
    </form>
</main>
